name: Dev AI Wiki Updater

on:
  schedule:
    - cron: '0 0 * * 0' # Se ejecuta cada domingo a la medianoche (UTC)
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la UI de GitHub

jobs:
  update-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para que GITHUB_TOKEN pueda hacer commit y push

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Ejecutar script de actualización de modelos
        run: python scripts/update-models.py
        
      - name: Hacer commit y push de los cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/models.json data/history.json
          # Si no hay cambios, el commit fallará, usamos || true para evitar que el workflow se rompa
          git commit -m "chore(data): actualización automatizada de modelos [skip ci]" || echo "No hay cambios para commitear"
          git push
